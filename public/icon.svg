<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep premium sapphire brand gradient -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <!-- Metallic aluminum structure gradient -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <!-- Glass reflection blue gradient -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1" />
    </linearGradient>
    <!-- Glow shadow drop -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2563eb" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Solid background card -->
  <rect width="512" height="512" rx="128" fill="url(#brand-grad)" />

  <!-- Outer ring accent -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#2563eb" stroke-opacity="0.3" stroke-width="8" />

  <!-- Icon emblem with shadow -->
  <g filter="url(#glow)">
    <!-- Base structural frame for Aluminum Double Pane Sliding Door/Window (Aludev) -->
    <rect x="96" y="96" width="320" height="320" rx="24" fill="#0f172a" stroke="url(#metal-grad)" stroke-width="20" />
    
    <!-- Left Pane with Glass Texture -->
    <rect x="116" y="116" width="134" height="280" rx="8" fill="url(#glass-grad)" stroke="url(#metal-grad)" stroke-width="12" />
    <!-- Left Pane crossbar accent -->
    <line x1="116" y1="256" x2="250" y2="256" stroke="url(#metal-grad)" stroke-width="8" />

    <!-- Right Pane with Glass Texture -->
    <rect x="262" y="116" width="134" height="280" rx="8" fill="url(#glass-grad)" stroke="url(#metal-grad)" stroke-width="12" />
    <!-- Right Pane crossbar accent -->
    <line x1="262" y1="256" x2="396" y2="256" stroke="url(#metal-grad)" stroke-width="8" />

    <!-- Stylized Aludev center "A" profile reinforcement -->
    <path d="M 230 400 L 256 180 L 282 400 Z" fill="url(#metal-grad)" opacity="0.9" />
    
    <!-- Glass sheen diagonal reflection lines -->
    <path d="M 140 130 L 220 210" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.4" />
    <path d="M 285 130 L 365 210" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.4" />
    <path d="M 130 280 L 190 340" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.2" />
    <path d="M 275 280 L 335 340" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.2" />
  </g>
</svg>
